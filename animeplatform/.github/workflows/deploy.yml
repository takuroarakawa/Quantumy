name: Deploy to Vercel

on:
  push:
    branches: [main]
    paths:
      - "animeplatform/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: animeplatform

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: animeplatform/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install dependencies
        run: npm ci

      - name: Switch schema to PostgreSQL
        run: bash scripts/use-postgres.sh

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✅ Deployed: $URL"

      - name: Restore schema to SQLite
        if: always()
        run: bash scripts/use-sqlite.sh

      - name: Comment deployment URL on commit
        if: success()
        run: |
          echo "🚀 Elementary deployed: ${{ steps.deploy.outputs.url }}"
