[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.9"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7.4", features = ["runtime-tokio-rustls", "sqlite", "macros"] }
jsonwebtoken = "8.3.0"
bcrypt = "0.15.1"
dotenvy = "0.15"
time = "=0.3.36"
base64ct = "=1.6.0"
home = "=0.5.9"
