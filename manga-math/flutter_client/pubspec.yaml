name: manga_math
description: Elementary — Interactive manga math objects viewer
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  http: ^1.2.0
  dio: ^5.4.0

  # 数式レンダリング (KaTeX Web View)
  flutter_math_fork: ^0.7.2       # TeX/KaTeX レンダリング（ネイティブ）
  webview_flutter: ^4.7.0         # WebView経由のKaTeX（フォールバック）

  # 状態管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.4

  # モデル / JSON
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # UI
  cached_network_image: ^3.3.1

  # UUID
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/katex/
