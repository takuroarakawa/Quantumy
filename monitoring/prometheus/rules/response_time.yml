groups:
  - name: response_time
    interval: 30s
    rules:
      # P95レイテンシが500ms超で1分継続 → Warning
      - alert: HighResponseTimeP95Warning
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket[5m])
          ) > 0.5
        for: 1m
        labels:
          severity: warning
          action: notify
        annotations:
          summary: "P95レイテンシが高い ({{ $labels.job }})"
          description: "P95レイテンシ {{ $value | humanizeDuration }} — 閾値 500ms 超"
          runbook: "https://wiki.elementary.jp/runbooks/high-latency"

      # P95レイテンシが2秒超で2分継続 → Critical → 自動再起動
      - alert: HighResponseTimeP95Critical
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket[5m])
          ) > 2.0
        for: 2m
        labels:
          severity: critical
          action: restart_instance
        annotations:
          summary: "P95レイテンシが危機的 ({{ $labels.job }})"
          description: "P95レイテンシ {{ $value | humanizeDuration }} — 閾値 2s 超。自動再起動を実行。"

      # P99レイテンシが5秒超
      - alert: HighResponseTimeP99Critical
        expr: |
          histogram_quantile(0.99,
            rate(http_request_duration_seconds_bucket[5m])
          ) > 5.0
        for: 1m
        labels:
          severity: critical
          action: failover
        annotations:
          summary: "P99レイテンシが極めて高い ({{ $labels.job }})"
          description: "P99レイテンシ {{ $value | humanizeDuration }} — バックアップへのフェイルオーバーを検討"
