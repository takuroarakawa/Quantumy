version: "3.9"

services:
  # ─── Prometheus ────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: elementary-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
      - --web.enable-admin-api
    ports:
      - "9090:9090"
    networks:
      - monitoring

  # ─── Alertmanager ──────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: elementary-alertmanager
    restart: unless-stopped
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    networks:
      - monitoring

  # ─── Grafana ────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: elementary-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-elementary2024}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: publicDashboards
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring

  # ─── Node Exporter (サーバーメトリクス) ─────────────
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: elementary-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    expose:
      - 9100
    networks:
      - monitoring

  # ─── Rust アラートハンドラー ──────────────────────────
  rust-alert-handler:
    build:
      context: ./rust-alert
      dockerfile: Dockerfile
    container_name: elementary-alert-handler
    restart: unless-stopped
    environment:
      LISTEN_ADDR: "0.0.0.0:8090"
      ELEMENTARY_API_URL: ${ELEMENTARY_API_URL:-http://localhost:3000}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      INSTANCE_RESTART_SCRIPT: /scripts/restart_instance.sh
    volumes:
      - ./rust-alert/scripts:/scripts:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8090:8090"
    networks:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
